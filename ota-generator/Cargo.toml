[package]
name = "ota-generator"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "std OTA delta generator: program search on Vulkan compute, payload assembly and RSA signing."

[dependencies]
clap = { workspace = true }
ota-cli-args = { path = "../ota-cli-args" }
ota-payload = { path = "../ota-payload" }
# needed to call `encode_to_vec()` on the prost-generated messages
prost = { version = "0.14", default-features = false }
# zlib encoding of single blocks. `with-alloc` provides the Vec-returning
# encoder; the client side (ota-payload) uses only the allocation-free decoder.
miniz_oxide = { version = "0.9", features = ["with-alloc"] }
# Vulkan bindings for the search's compute scans. `loaded` opens libvulkan at run time, so
# the crate builds without a loader and reports a missing device instead.
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[[bin]]
name = "ota-gen"
path = "src/main.rs"

[dev-dependencies]
# Sets a default ACL on a test directory with `setxattr`, which the standard library does not offer.
# The crate is already in the lock file through `ota-cli`, so this adds no code to the build.
libc = "0.2"
