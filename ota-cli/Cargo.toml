[package]
name = "ota-cli"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Reference host bindings: file-backed device and the ota-apply tool."

[dependencies]
clap = { workspace = true }
# Only for `O_NOFOLLOW`, which makes the checkpoint open refuse a symbolic link. The crate is
# already in the lock file for other dependencies, so this adds no new code to the build.
libc = "0.2"
ota-cli-args = { path = "../ota-cli-args" }
ota-client = { path = "../ota-client" }
ota-payload = { path = "../ota-payload" }

[dev-dependencies]
ota-generator = { path = "../ota-generator" }

[[bin]]
name = "ota-apply"
path = "src/main.rs"
