name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler glslc libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check embedded target
        run: cargo check -p delta-update-client --target riscv32imac-unknown-none-elf
