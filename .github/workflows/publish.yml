name: Publish crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - delta-update-cli
          - delta-update-args
          - delta-update-client
          - delta-update-generator
          - delta-update-payload

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish all crates
        if: ${{ inputs.crate == 'all' }}
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}

      - name: Publish selected crate
        if: ${{ inputs.crate != 'all' }}
        run: cargo publish --package "${{ inputs.crate }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
