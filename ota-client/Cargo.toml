[package]
name = "ota-client"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "no_std OTA apply middleware over trait-abstracted storage sinks."

[dependencies]
ota-payload = { path = "../ota-payload" }

[dev-dependencies]
# tests generate signed payloads end-to-end
ota-generator = { path = "../ota-generator" }
# needed to call `encode_to_vec()` on hand-built test manifests
prost = { version = "0.14", default-features = false }
