[package]
name = "delta-update-payload"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition.workspace = true
description = "Payload format, signing and verification (no_std + alloc)."

[dependencies]
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2", "u64_digit"] }
sha2 = { version = "0.11" }
prost = { version = "0.14", default-features = false, features = ["derive"] }
miniz_oxide = { version = "0.9", default-features = false }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
miniz_oxide = { version = "0.9", features = ["with-alloc"] }

[features]
default = []
